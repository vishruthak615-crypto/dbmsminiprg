<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medical Translator | Tourist Medicare Assist</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#3b82f6,#06b6d4,#67e8f9);
    padding:30px;
}

.back-btn{
    background:white;
    color:#2563eb;
    text-decoration:none;
    padding:10px 20px;
    border-radius:10px;
    font-weight:600;
}

.header{
    text-align:center;
    color:white;
    margin:30px 0;
}

.header h1{
    font-size:3rem;
}

.container{
    max-width:1000px;
    margin:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

.card h2{
    color:#2563eb;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:120px;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
    resize:none;
    font-size:16px;
}

select{
    width:100%;
    padding:12px;
    margin:15px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.phrase{
    background:#eff6ff;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.phrase:hover{
    transform:translateX(5px);
    transition:.3s;
}

</style>
</head>
<body>

<a href="home.html" class="back-btn">← Home</a>

<div class="header">
    <h1>🌐 Medical Translator</h1>
    <p>Communicate Easily During Medical Emergencies</p>
</div>

<div class="container">

    <div class="card">

        <h2>Translate Message</h2>

        <textarea placeholder="Type your medical concern here..."></textarea>

        <select>
            <option>English</option>
            <option>Kannada</option>
            <option>Hindi</option>
            <option>Tamil</option>
            <option>Telugu</option>
        </select>

        <button onclick="translateText()">
            Translate
        </button>

    </div>

    <div class="card">

        <h2>🚑 Emergency Medical Phrases</h2>

        <div class="phrase">
            ❗ I need a doctor immediately.
        </div>

        <div class="phrase">
            ❤️ I have chest pain.
        </div>

        <div class="phrase">
            🩸 I am bleeding.
        </div>

        <div class="phrase">
            🤕 I need emergency medical help.
        </div>

        <div class="phrase">
            💊 I am allergic to certain medicines.
        </div>

        <div class="phrase">
            🚑 Please call an ambulance.
        </div>

    </div>

</div>

<script>

function translateText(){

alert(
"🌐 Translation Feature Demo\n\n" +
"In the full version, this text would be translated into the selected language."
);

}

</script>

</body>
</html>
